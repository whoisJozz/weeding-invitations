<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- FIX iOS: viewport-fit=cover para utilizar toda la pantalla y respetar el Safe Area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestra Boda | A&Y </title>
    
    <!-- FIX 404: Favicon SVG inline (Evita peticiones fallidas a favicon.ico) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
    
    <!-- FIX CLS: Preload de la fuente principal crítica (Symphony) -->
    <link rel="preload" href="assets/fonts/Symphony.woff2" as="font" type="font/woff2" crossorigin>
    
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/main.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js" defer></script>
    
    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <!-- ACTO I: Experiencia de Introducción -->
    <section id="intro" class="intro-section" aria-label="Introducción cinematográfica">
        <div id="start-text" class="intro-text">Toca para abrir</div>
        <video id="intro-video" class="intro-video" src="assets/video/intro.mp4" playsinline muted preload="auto"></video>
        <audio id="bg-audio" src="assets/audio/background.mp3" loop preload="auto"></audio>
    </section>

    <!-- ACTO II: Portada Editorial Final (Sprint 02.3) -->
    <section id="hero" class="hero-section" aria-hidden="true">
        <!-- El fondo queda completamente limpio. Se eliminó la textura. -->
        
        <div class="hero-frame">
            <div id="sparkles-container"></div>
            
            <!-- Flores Oficiales desbordando ligeramente el marco. -->
            <img src="assets/images/floral/flowers-top-left.png" class="floral-accent top-left" alt="" aria-hidden="true" decoding="async">
            <img src="assets/images/floral/flowers-bottom-right.png" class="floral-accent bottom-right" alt="" aria-hidden="true" decoding="async">
            
            <div class="hero-content">
                <span class="hero-kicker">Nuestra Boda</span>
                
                <h1 class="hero-title">
                    <span class="name">Andrew Zarate</span>
                    <span class="ampersand">&</span>
                    <span class="name">Yahtzyri Lugo</span>
                </h1>
                
                <p class="hero-quote">"De la mano de DIOs, queremos unir nuestros caminos"</p>
                
                <!-- Los detalles adicionales se removieron temporalmente para limpiar el DOM y priorizar el espacio negativo del Hero Final. -->
            </div>
        </div>
    </section>
</body>
</html>
