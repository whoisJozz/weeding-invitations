<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>A&Y | Nuestra Boda </title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
    
    <link rel="preload" href="assets/fonts/Symphony.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- FIX: Regresamos a PNG para mantener la máxima calidad tras los problemas de conversión -->
    <link rel="preload" href="assets/images/floral/flowers-top-left.png" as="image" type="image/png">
    <link rel="preload" href="assets/images/floral/flowers-bottom-right.png" as="image" type="image/png">
    
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/main.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js" defer></script>
    
    <script type="module" src="js/main.js" defer></script>
</head>
<body style="overflow-y: hidden;">
    <div class="editorial-background" aria-hidden="true"></div>

    <section id="intro" class="intro-section" aria-label="Introducción cinematográfica">
        <div id="start-text" class="intro-text">Toca para abrir</div>
        <video id="intro-video" class="intro-video" src="assets/video/intro.mp4" playsinline muted preload="auto"></video>
        <audio id="bg-audio" src="assets/audio/background.mp3" loop preload="auto"></audio>
    </section>

    <section id="hero" class="hero-section" aria-hidden="true">
        <div class="hero-frame">
            <div id="sparkles-container"></div>
            
            <!-- FIX: Rutas actualizadas a PNG -->
            <img src="assets/images/floral/flowers-top-left.png" class="floral-accent top-left" alt="" aria-hidden="true" decoding="async">
            <img src="assets/images/floral/flowers-bottom-right.png" class="floral-accent bottom-right" alt="" aria-hidden="true" decoding="async">
            
            <div class="hero-content">
                <span class="hero-kicker">Nuestra Boda</span>
                
                <h1 class="hero-title">
                    <span class="name">Andrew Zarate</span>
                    <span class="ampersand">&</span>
                    <span class="name">Yahtzyri Lugo</span>
                </h1>
                
                <p class="hero-quote">"El inicio de nuestra nueva historia."</p>
            </div>
        </div>
    </section>

    <section id="story" class="story-section">
        <div class="story-content">
            <p class="story-text">"Toda gran historia comienza con un <span class="highlight-gold">sí</span>."</p>
            <p class="story-text">"Nuestros caminos se cruzaron de manera <span class="highlight-gold">inesperada</span>."</p>
            <p class="story-text">"Y desde ese instante, supimos que sería <span class="highlight-gold">para siempre</span>."</p>
        </div>
    </section>

    <section id="fecha" class="hidden-section" aria-hidden="true"></section>
    <section id="contador" class="hidden-section" aria-hidden="true"></section>
    <section id="ceremonia" class="hidden-section" aria-hidden="true"></section>
    <section id="recepcion" class="hidden-section" aria-hidden="true"></section>
    <section id="dress-code" class="hidden-section" aria-hidden="true"></section>
    <section id="mesa-regalos" class="hidden-section" aria-hidden="true"></section>
    <section id="padrinos" class="hidden-section" aria-hidden="true"></section>
    <section id="confirmacion" class="hidden-section" aria-hidden="true"></section>
</body>
</html>
