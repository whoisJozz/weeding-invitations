<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A&Y | Nuestra Boda </title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
    
    <!-- FIX SPRINT 02.5: Precarga de tipografía crítica -->
    <link rel="preload" href="assets/fonts/Symphony.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- FIX SPRINT 02.5: Precarga de SVG para garantizar existencia en memoria antes del Hero -->
    <link rel="preload" href="assets/images/flowers-top-left.svg" as="image" type="image/svg+xml">
    <link rel="preload" href="assets/images/flowers-bottom-right.svg" as="image" type="image/svg+xml">
    
    <link rel="stylesheet" href="css/base/typography.css">
    <link rel="stylesheet" href="css/main.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js" defer></script>
    
    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <!-- ACTO I: Experiencia de Introducción -->
    <section id="intro" class="intro-section" aria-label="Introducción cinematográfica">
        <div id="start-text" class="intro-text">Toca para abrir</div>
        <video id="intro-video" class="intro-video" src="assets/video/intro.mp4" playsinline muted preload="auto"></video>
        <audio id="bg-audio" src="assets/audio/background.mp3" loop preload="auto"></audio>
    </section>

    <!-- ACTO II: Portada Editorial Final -->
    <section id="hero" class="hero-section" aria-hidden="true">
        <div class="hero-frame">
            <div id="sparkles-container"></div>
            
            <!-- FIX SPRINT 02.5: Rutas exactas sincronizadas con la precarga y extensión correcta (SVG) -->
            <img src="assets/images/flowers-top-left.svg" class="floral-accent top-left" alt="" aria-hidden="true" decoding="async">
            <img src="assets/images/flowers-bottom-right.svg" class="floral-accent bottom-right" alt="" aria-hidden="true" decoding="async">
            
            <div class="hero-content">
                <span class="hero-kicker">Nuestra Boda</span>
                
                <h1 class="hero-title">
                    <span class="name">Andrew Zarate</span>
                    <span class="ampersand">&</span>
                    <span class="name">Yahtzyri Lugo</span>
                </h1>
                
                <p class="hero-quote">"El inicio de nuestra nueva historia."</p>
            </div>
        </div>
    </section>
</body>
</html>
